# =====================================================================
# 🏛️ BAZAAR REPUBLIC: ECOSYSTEM INGRESS &persistence LAYER STACK
# File: docker-compose-v6-gateway-v3.yml
# =====================================================================

networks:
  bzr-network:
    name: bzr-depin-net
    driver: bridge

volumes:
  mongodb_data:
    driver: local

services:
  # =====================================================================
  # 1. DATABASE & PERSISTENCE LAYER (Hardened Isolation)
  # =====================================================================
  db:
    image: mongo:6.0
    container_name: bzr-db
    restart: always
    ports:
      - "127.0.0.1:27017:27017" # Bound strictly to local loopback to prevent external DB port scanner bypass
    environment:
      MONGO_INITDB_DATABASE: bazaar_republic
    volumes:
      - mongodb_data:/data/db
    networks:
      - bzr-network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}); } catch (err) { quit(1); } }"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 2. PRIMARY NODE CORE & INGRESS ROUTER (Bazaar Republic App - High Priority SLA)
  # =====================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bzr-nextjs-app
    restart: always
    ports:
      - "3000:3000" # Expose directly to allow the host port proxy or official SoloHost remote gateway (31409) to communicate natively
    environment:
      - DATABASE_URL=mongodb://db:27017/bazaar_republic?replicaSet=rs0&directConnection=true&readConcernLevel=majority&w=majority
      - MONGODB_URI=mongodb://db:27017/bazaar_republic?replicaSet=rs0&directConnection=true&readConcernLevel=majority&w=majority
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - BAZAAR_VAULT_CONTRACT_ID=CDI5EAXHES3KPZBLAICUWUSDCLFGTN3MDURTFMQCXTQWFSYRK357YPD6
      - PI_API_KEY=${PI_API_KEY}
      - NEXT_PUBLIC_PI_SANDBOX=true
    networks:
      - bzr-network
    volumes:
      - ./healthcheck.sh:/app/healthcheck.sh
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4GB # Generous memory envelope for high-frequency ledger processing
        reservations:
          memory: 2GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =====================================================================
  # 3. ON-CHAIN RELAYER DAEMON (Bazaar Relayer - SLA Prioritized)
  # =====================================================================
  relayer:
    build:
      context: .
      dockerfile: Dockerfile.relayer
    container_name: bzr-bridge-relayer
    restart: always
    environment:
      - DATABASE_URL=mongodb://db:27017/bazaar_republic?replicaSet=rs0&directConnection=true&readConcernLevel=majority&w=majority
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - BAZAAR_VAULT_CONTRACT_ID=CDI5EAXHES3KPZBLAICUWUSDCLFGTN3MDURTFMQCXTQWFSYRK357YPD6
      - PI_API_KEY=${PI_API_KEY}
    networks:
      - bzr-network
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 1m30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512MB

  # =====================================================================
  # 4. SIBLING dAPP: OpenClaw AI (Lightweight Mock Ingress Stub)
  # =====================================================================
  ai-agent:
    image: nginx:alpine
    container_name: bzr-openclaw-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80" # Exposed strictly on loopback for local diagnostic pings
    networks:
      - bzr-network
    command: >
      /bin/sh -c "echo '<html><head><title>OpenClaw AI</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;padding:2rem;}h1{color:#58a6ff;}</style></head><body><h1>🤖 OpenClaw AI Stub Gateway</h1><p>Bazaar Republic Multi-dApp Ingress Test Success!</p><p>Next.js Rewrite proxy resolved cleanly over private bridge network.</p></body></html>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256MB

  # =====================================================================
  # 5. SIBLING dAPP: Atlassian MCP Server (Lightweight Mock Ingress Stub)
  # =====================================================================
  mcp-server:
    image: nginx:alpine
    container_name: bzr-atlassian-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:19000:80" # Exposed strictly on loopback for local diagnostic pings
    networks:
      - bzr-network
    command: >
      /bin/sh -c "echo '<html><head><title>Atlassian MCP</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;padding:2rem;}h1{color:#ff7b72;}</style></head><body><h1>📋 Atlassian Jira MCP Stub Gateway</h1><p>Bazaar Republic Multi-dApp Ingress Test Success!</p><p>Next.js Rewrite proxy resolved cleanly over private bridge network.</p></body></html>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256MB