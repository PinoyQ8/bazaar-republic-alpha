name: Security Audit & Type Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Bazaar Security Audit & tsc
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run payment, escrow/staking, and TypeScript checks
        run: npm run audit:security
