title: Bazaar Republic Alpha Configuration
description: Autonomous compute and validation node for the Pi Network ecosystem.
output_file: .env

fields:
  - name: PI_API_KEY
    type: text
    label: Pi API Key
    default: "FtbUB9fO3zfZZG3cp2SEpEdgzTNEgqpliDl8Q7Jr9Nc"
    required: true
    help: API key used to authenticate with Pi Network platform services.

fixed_values:
  - name: UID
    detect: uid
  - name: NODE_ENV
    value: production
  - name: NEXT_PUBLIC_PI_SANDBOX
    value: "true"