[package]
name = "mesh-contracts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"] # 🛡️ CRITICAL: Tells the compiler this is a Soroban WASM contract, not a standard Rust binary.

[dependencies]
soroban-sdk = "20.0.0"  # ⚓ Anchors your specific contract to the Pi/Soroban network logic.