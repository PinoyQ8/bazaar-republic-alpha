version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: bzr-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bazaar_republic
    volumes:
      - mongodb_data:/data/db
    networks:
      - bzr-network
    # Run as a single-node replica set to support Prisma / MongoDB multi-document transactions
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); } catch (err) { quit(1); }"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bzr-nextjs-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - BAZAAR_VAULT_CONTRACT_ID=CDI5EAXHES3KPZBLAICUWUSDCLFGTN3MDURTFMQCXTQWFSYRK357YPD6
      - PI_API_KEY=${PI_API_KEY}
      - NEXT_PUBLIC_PI_SANDBOX=true
    networks:
      - bzr-network
    volumes:
      - ./healthcheck.sh:/app/healthcheck.sh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Simplified container healthcheck to avoid OOM/hardware false negatives & dependency errors inside Node container
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  relayer:
    build:
      context: .
      dockerfile: Dockerfile.relayer
    container_name: bzr-bridge-relayer
    restart: always
    environment:
      - DATABASE_URL=mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - BAZAAR_VAULT_CONTRACT_ID=CDI5EAXHES3KPZBLAICUWUSDCLFGTN3MDURTFMQCXTQWFSYRK357YPD6
      - PI_API_KEY=${PI_API_KEY}
    networks:
      - bzr-network
    depends_on:
      db:
        condition: service_healthy
    # Ensure active transactional batches can complete before the daemon is force-killed
    stop_grace_period: 1m30s

volumes:
  mongodb_data:
    driver: local

networks:
  bzr-network:
    driver: bridge
