[package]
name = "pi-rust"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib/lib.rs" 

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"

[workspace]
