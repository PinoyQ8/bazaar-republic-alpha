services:
  # =====================================================================
  # 1. DATABASE LAYER (Prisma Replica Set Enabled)
  # =====================================================================
  db:
    image: docker.io/library/mongo:6.0
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bazaar_republic
    volumes:
      - mongodb_data:/data/db
    networks:
      bzr-network:
        aliases:
          - mongo
          - db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}); } catch (err) { quit(1); } }"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 2. NEXT.JS APPLICATION CONTAINER (Pre-built SoloHost Production Image)
  # =====================================================================
  web:
    image: docker.io/pinoyq8/bazaar-republic-alpha:latest
    pull_policy: always
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_PI_SANDBOX=true
      - DATABASE_URL=mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority
      - MONGODB_URI=mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - NEXT_PUBLIC_SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
      - BAZAAR_VAULT_CONTRACT_ID=CBM5SVJHLHNAEUR4GA3IV5KZFPCCMGTZGMAJUNURUQIEFPTKZLKXQ3RY
      - NEXT_PUBLIC_BAZAAR_VAULT_CONTRACT_ID=CBM5SVJHLHNAEUR4GA3IV5KZFPCCMGTZGMAJUNURUQIEFPTKZLKXQ3RY
      - PI_API_KEY=${PI_API_KEY:-FtbUB9fO3zfZZG3cp2SEpEdgzTNEgqpliDl8Q7Jr9Nc}
    networks:
      - bzr-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
    driver: local

networks:
  bzr-network:
    driver: bridge