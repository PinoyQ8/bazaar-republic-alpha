version: '3.8'

services:
  # 1. Embedded Ledger (Replica Set Enabled)
  db:
    image: docker.io/library/mongo:6.0
    restart: always
    ports:
      - "0.0.0.0:27017:27017" # Exposes DB to LAN for Nitro 5 / client nodes
    environment:
      MONGO_INITDB_DATABASE: bazaar_republic
    volumes:
      - mongodb_data:/data/db
    networks:
      bzr-network:
        aliases:
          - mongo
          - db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}); } catch (err) { quit(1); } }"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Next.js Core Application
  web:
    image: docker.io/pinoyq8/bazaar-republic-alpha:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_PI_SANDBOX=true
      - DATABASE_URL=${MONGODB_URI}
      - MONGODB_URI=${MONGODB_URI}
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - BAZAAR_VAULT_CONTRACT_ID=CDI5EAXHES3KPZBLAICUWUSDCLFGTN3MDURTFMQCXTQWFSYRK357YPD6
    networks:
      - bzr-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
    driver: local

networks:
  bzr-network:
    driver: bridge