services:
  db:
    image: mongo:6.0
    container_name: bzr-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bazaar_republic
    volumes:
      - mongodb_data:/data/db
    networks:
      - bzr-network
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bazaar-republic-alpha-web-1
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PI_SANDBOX: "true"
      RUNTIME: X570-Master-Command
      DATABASE_URL: "mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority"
      MONGODB_URI: "mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority"
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      BAZAAR_VAULT_CONTRACT_ID: CBM5SVJHLHNAEUR4GA3IV5KZFPCCMGTZGMAJUNURUQIEFPTKZLKXQ3RY
      NEXT_PUBLIC_BAZAAR_VAULT_CONTRACT_ID: CBM5SVJHLHNAEUR4GA3IV5KZFPCCMGTZGMAJUNURUQIEFPTKZLKXQ3RY
    networks:
      - bzr-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local

networks:
  bzr-network:
    driver: bridge
