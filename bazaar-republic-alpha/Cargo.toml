[package]
name = "bazaar-republic-alpha"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
pioneer_auth = { path = "../pioneer_auth" }

# 🛡️ FUSED CLIENT DEPENDENCIES
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"
# Moved tokio here so the core client code can execute async logic
tokio = { version = "1.0", features = ["full"] } 

[dev-dependencies]
wiremock = "0.5"
# tokio is no longer needed here as it is inherited from the main block