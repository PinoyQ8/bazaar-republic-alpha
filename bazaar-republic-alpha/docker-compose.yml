# docker-compose.yml — Pi Desktop SoloHost Manifest
services:
  web:
    image: docker.io/pinoyq8/pi-app-pinoyq8-bazaar-republic:latest
    container_name: pi-app-pinoyq8-bazaar-republic
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}