title: Bazaar Republic Alpha Configuration
description: Autonomous compute and validation node for the Pi Network ecosystem.
output_file: .env

fixed_values:
  - name: UID
    detect: uid
  - name: NODE_ENV
    value: production
  - name: NEXT_PUBLIC_PI_SANDBOX
    value: "true"

fields:
  - name: MONGODB_URI
    label: MongoDB Connection URI
    type: text
    required: true
    default: mongodb://db:27017/bazaar_republic?replicaSet=rs0&readConcernLevel=majority&w=majority
    help: Connection URI for the embedded ledger replica set.