title: Bazaar Republic Alpha Configuration
description: Autonomous compute and validation node for the Pi Network ecosystem.
output_file: .env

fixed_values:
  - name: UID
    detect: uid
  - name: NODE_ENV
    value: production
  - name: NEXT_PUBLIC_PI_SANDBOX
    value: "true"

fields:
  - name: NODE_ID
    label: Sovereign Node Identifier
    type: text
    required: true
    default: Node-002-Nitro5
    help: Unique identifier for this local relayer node.

  - name: NODE_LABEL
    label: Dashboard Display Name
    type: text
    required: true
    default: Relayer - Nitro5
    help: Friendly name displayed on the Mesh HUD.
